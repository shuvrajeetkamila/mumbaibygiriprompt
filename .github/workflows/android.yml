# =============================================================================
#  MUMBAI 1:1 EXACT — .github/workflows/android.yml
#
#  Builds the Android APK.  A runner is the only machine in this loop with a JDK,
#  the Android SDK, the NDK and unrestricted network; the development sandbox has
#  none of them, and an APK that has never been built is not an APK (D-045).
#
#  What it produces:
#
#    app-debug.apk             installable as-is (signed with the debug key).
#                              This is the "first build": `adb install` it.
#    app-release-unsigned.apk  the same code, no debug symbols, unsigned on
#                              purpose — signing needs a key that belongs to
#                              whoever ships this, not to a build script.
#    a size report             APK sizes, per-ABI library sizes, and the shader
#                              inventory, printed into the log.
#
#  Two deliberate choices about the setup:
#
#    * **No android-actions/setup-android.**  The runner image already carries an
#      Android SDK and cmdline-tools; the action was the first thing to fail here
#      and it is one more moving part between the log and the compiler.
#    * **The shaders compile as their own step, before Gradle.**  If they fail,
#      the reason is next to the shader's name instead of buried under a native
#      build that also compiled 122 Jolt translation units.
#
#  The world is not in the APK: 1.3 GB of chunks is a first-run download, so the
#  first build draws its sky, and says on the log where the world belongs.
# =============================================================================
name: android

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      physics:
        description: 'Build Jolt and the physics engine into the client'
        type: boolean
        default: true

jobs:
  apk:
    name: build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Only for publishing the APK as a release asset: an artifact needs a GitHub
    # login to download, and a release asset is a plain link anyone can open.  The
    # repository is public, so that link works on a phone with no GitHub session.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate the Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "no SDK at $SDK; looking for one"
            SDK=$(dirname "$(dirname "$(find / -maxdepth 6 -type d -name 'platform-tools' 2>/dev/null | head -1)")")
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties
          echo "sdk.dir=$SDK"
          ls "$SDK" || true

      - name: Install platform, build tools, NDK and CMake
        run: |
          set -e
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_SDK_ROOT" -maxdepth 5 -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" 2>&1 | tail -5
          echo "--- installed"
          "$SDKMANAGER" --list_installed 2>/dev/null | tail -12

      - name: Install a GLSL compiler
        # apt first (seconds); the project's own fetcher as the fallback, which is
        # also the path a machine with no Vulkan SDK takes.
        run: |
          set -e
          if command -v glslc >/dev/null || command -v glslangValidator >/dev/null; then
            echo "already present"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq glslang-tools || bash tools/get_glslang.sh
          fi
          glslangValidator --version 2>/dev/null | head -2 || \
            echo "built by tools/get_glslang.sh into build/tools/glslang"

      - name: Compile the shaders, on their own
        run: |
          set -e
          export PATH="$PWD/build/tools/glslang:$PATH"
          python3 tools/compile_shaders.py engine/render/shaders build/spv

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the APKs
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            -PmumbaiPhysics=${{ github.event.inputs.physics == 'false' && 'OFF' || 'ON' }} \
            assembleDebug assembleRelease 2>&1 | tee gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Surface the build errors
        # The build's own log is the whole point of running it, and a runner's log
        # files are not always retrievable from outside.  Annotations and the step
        # summary are, through the API, so the first errors are copied there where
        # they can be read and fixed (D-045).
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import os, re, glob
          logs = []
          for path in glob.glob('/home/runner/work/**/gradle-build.log', recursive=True) +                       glob.glob(os.path.join(os.getcwd(), 'gradle-build.log')):
              try:
                  logs.append((path, open(path, errors='replace').read()))
              except OSError:
                  pass
          if not logs:
              print('no gradle log found')
          pattern = re.compile(r'(error:|error C[0-9]|CMake Error|FAILURE:|What went wrong|'
                               r'Execution failed for task|Caused by:|ninja: error|'
                               r'undefined reference|No such file or directory|'
                               r'Could not (resolve|find|determine))')
          for path, text in logs:
              lines = text.splitlines()
              hits = [l.strip() for l in lines if pattern.search(l)]
              print(f'--- {path}: {len(lines)} lines, {len(hits)} error-ish')
              for line in hits[:10]:
                  print(f'::error::{line[:900]}')
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a') as f:
                      f.write(f'### {path} — last 80 lines\n\n```\n')
                      f.write('\n'.join(lines[-80:]))
                      f.write('\n```\n')
              print('--- last 60 lines')
              print('\n'.join(lines[-60:]))
          PYTHON

      - name: Report what was built
        # The report goes three places on purpose: the log (for a human watching
        # the run), annotations and the job summary (because a runner's log files
        # and the log-download CDN are not reachable from every machine that needs
        # to answer "how big is the APK and what is in it") — D-045.
        if: always()
        run: |
          OUT=apk-report.txt
          {
            echo "=== APKs ==="
            find android/app/build/outputs -name '*.apk' -printf '%10s  %p\n' 2>/dev/null | sort -k2 \
              || echo "none built"
            for apk in $(find android/app/build/outputs -name '*.apk' 2>/dev/null); do
              echo "--- contents of $apk"
              unzip -l "$apk" | awk 'NR <= 3 || $4 ~ /lib\/|classes|resources|META-INF/ { printf "%10d  %s\n", $1, $4 }'
              echo "--- total"
              unzip -l "$apk" | tail -1
            done
            echo "=== native libraries ==="
            find android/app/build -name 'libmumbai.so' -printf '%10s  %p\n' 2>/dev/null || true
            echo "=== shaders embedded in the binary ==="
            for header in $(find android/app/.cxx -name 'shaders_generated.h' 2>/dev/null | head -2); do
              echo "--- $header"
              grep -c "inline constexpr std::uint32_t" "$header" || true
              grep -o "SpvWords = [0-9]*" "$header" | tr '\n' ' '
              echo
            done
          } > "$OUT" 2>&1 || true
          cat "$OUT"
          grep -E "apk|libmumbai|words" "$OUT" | head -24 | sed 's/^/::notice::/'
          {
            echo "## APK report"
            echo ""
            echo '```'
            cat "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the APK contains the engine and its shaders
        # "The build succeeded" and "the APK is the client" are different claims.
        # Two things could be missing without any error: the shader modules (a
        # build with no GLSL compiler embeds empty arrays, which is why
        # compile_shaders.py now fails without one) and the engine library itself.
        run: |
          set -e
          APK=$(find android/app/build/outputs -name 'app-debug.apk' | head -1)
          test -n "$APK" || { echo "::error::no debug APK was produced"; exit 1; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmumbai.so' || \
            { echo "::error::the APK has no libmumbai.so"; exit 1; }
          SIZE=$(unzip -l "$APK" | awk '$4 == "lib/arm64-v8a/libmumbai.so" { print $1 }')
          echo "libmumbai.so in the APK: $SIZE bytes"
          [ "$SIZE" -gt 500000 ] || { echo "::error::libmumbai.so is too small to be the engine"; exit 1; }

          HDR=$(find android/app/.cxx -name 'shaders_generated.h' | head -1)
          test -n "$HDR" || { echo "::error::the native build produced no shaders_generated.h"; exit 1; }
          python3 - "$HDR" <<'PYTHON'
          import re, sys
          text = open(sys.argv[1]).read()
          words = [int(w) for w in re.findall(r'SpvWords = (\d+)', text)]
          print(f'{len(words)} shader modules, {sum(words)} words total')
          if len(words) != 9:
              sys.exit(f'expected 9 shader modules, found {len(words)}')
          if any(w < 100 for w in words):
              sys.exit('a shader module is empty: the build embedded placeholders, not SPIR-V')
          print('::notice::shaders embedded in the client: %d modules, %d words of SPIR-V'
                % (len(words), sum(words)))
          PYTHON

          echo "::notice::APK $(basename "$APK") $(stat -c%s "$APK") bytes, libmumbai.so $SIZE bytes"

      - name: Publish the APK as a release
        # A direct download link, which is the whole point: release assets are
        # fetchable without a session, Actions artifacts are not.
        if: github.event_name == 'push' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="first-build"
          # --repo and --target spelled out: gh would otherwise guess a remote, and
          # the tag would land on the default branch rather than on the commit
          # that actually produced this APK.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Mumbai 1:1 EXACT — first APK (first build)" \
              --prerelease \
              --notes "$(cat <<'NOTES'
          The first installable build of the Mumbai 1:1 client.

          **Download `app-debug.apk`** and install it on an Android phone
          (Android 10 or newer, 64-bit ARM).  You may need to allow installing
          from unknown sources; it is signed with the standard debug key, which
          is what a first build has.

          What it does: starts the engine on the phone's own Vulkan surface,
          creates the graphics device and the swapchain, builds its pipelines
          from the nine compiled shaders, and draws the sky and the tonemapped
          frame at the display's refresh rate, logging to logcat
          (`adb logcat -s mumbai`).

          What it does not do yet: show Mumbai.  The city is 1.3 GB of map data
          which is meant to be downloaded to the phone on first run, and that
          downloader is not written yet, so the app draws the sky and says on its
          log where the world belongs.  Touch controls, the world download and
          the renderer's clustered lights, soft transparency and anti-aliasing
          are the next pieces.

          `app-release-unsigned.apk` is the same code without a signature; it
          needs your own signing key before a phone will accept it.

          Built by GitHub Actions; the workflow refuses to publish unless the APK
          contains the engine library and all nine compiled shader modules.
          NOTES
          )"
          fi
          gh release upload "$TAG" android/app/build/outputs/apk/debug/app-debug.apk --clobber
          gh release upload "$TAG" android/app/build/outputs/apk/release/app-release-unsigned.apk --clobber
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) B  \(.url)"'

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload the unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-release-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload the SPIR-V modules
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-spirv
          path: build/spv/*.spv
          if-no-files-found: warn

      - name: Upload the native build's own files (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: |
            android/app/.cxx/**/build.ninja
            android/app/build/**/*.log
            android/local.properties
          if-no-files-found: ignore
