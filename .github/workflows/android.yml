# =============================================================================
#  MUMBAI 1:1 EXACT — .github/workflows/android.yml
#
#  Builds the Android APK.  This workflow exists because a runner is the only
#  machine in the loop that has a JDK, the Android SDK, the NDK and unrestricted
#  network: the development sandbox has none of them, and an APK that has never
#  been built is not an APK (D-045).
#
#  What it produces, and what each thing is for:
#
#    app-debug.apk    installable as-is (signed with the debug key).  This is the
#                     "first build": `adb install` and it runs.
#    app-release-unsigned.apk
#                     the same code without debug symbols, unsigned on purpose —
#                     signing needs a key that belongs to whoever ships this.
#    apk report       per-ABI library sizes, APK sizes, and the shader/SPIR-V
#                     inventory, printed into the log and attached as an artifact.
#
#  The world is deliberately *not* in the APK: 1.3 GB of chunks is a first-run
#  download, so the app reports an empty scene and says where the world belongs.
# =============================================================================
name: android

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform, build tools, NDK and CMake
        run: |
          set -x
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" 2>&1 | tail -20
          sdkmanager --list_installed | tail -20

      - name: Install a GLSL compiler (glslangValidator)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          glslangValidator --version | head -2

      - name: Point Gradle at the SDK
        # AGP reads sdk.dir from android/local.properties, otherwise the
        # ANDROID_HOME/ANDROID_SDK_ROOT environment.  Writing it explicitly means
        # the build does not depend on which of the three the runner exports.
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > android/local.properties
          cat android/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile the shaders first, by themselves
        # If the shaders fail, the reason must be in the log next to the shader's
        # name, not buried in a native build that also compiled 122 Jolt files.
        run: python3 tools/compile_shaders.py engine/render/shaders build/spv

      - name: Build the APKs
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Report what was built
        run: |
          set -e
          echo "=== APKs ====================================================="
          find android/app/build/outputs -name '*.apk' -printf '%10s  %p\n' | sort -k2
          echo
          for apk in $(find android/app/build/outputs -name '*.apk'); do
            echo "--- $apk"
            unzip -l "$apk" | awk '$4 ~ /^lib\// { printf "    %10d  %s\n", $1, $4 }'
            unzip -l "$apk" | tail -1
          done
          echo "=== native libraries ========================================="
          find android/app/build -name 'libmumbai.so' -printf '%10s  %p\n' || true
          echo "=== shaders embedded in the binary ==========================="
          grep -c "inline constexpr std::uint32_t" \
            android/app/.cxx/*/*/*/generated/shaders_generated.h 2>/dev/null || \
            echo "(generated header not found where expected; see the log above)"

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload the unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-release-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload the build log detail (native build files)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: |
            android/app/.cxx/**/build.ninja
            android/app/build/**/*.log
          if-no-files-found: ignore
