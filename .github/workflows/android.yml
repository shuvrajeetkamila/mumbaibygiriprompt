# =============================================================================
#  MUMBAI 1:1 EXACT — .github/workflows/android.yml
#
#  Builds the Android APK.  A runner is the only machine in this loop with a JDK,
#  the Android SDK, the NDK and unrestricted network; the development sandbox has
#  none of them, and an APK that has never been built is not an APK (D-045).
#
#  What it produces:
#
#    app-debug.apk             installable as-is (signed with the debug key).
#                              This is the "first build": `adb install` it.
#    app-release-unsigned.apk  the same code, no debug symbols, unsigned on
#                              purpose — signing needs a key that belongs to
#                              whoever ships this, not to a build script.
#    a size report             APK sizes, per-ABI library sizes, and the shader
#                              inventory, printed into the log.
#
#  Two deliberate choices about the setup:
#
#    * **No android-actions/setup-android.**  The runner image already carries an
#      Android SDK and cmdline-tools; the action was the first thing to fail here
#      and it is one more moving part between the log and the compiler.
#    * **The shaders compile as their own step, before Gradle.**  If they fail,
#      the reason is next to the shader's name instead of buried under a native
#      build that also compiled 122 Jolt translation units.
#
#  WHAT TRAVELS IN THE APK, AND WHAT DOES NOT.  South Bombay travels inside it —
#  96 MiB of chunks and the albedo array, so a fresh install shows the city rather
#  than an explanation (D-047) — and the other 899 cells do not: 1.27 GiB is a
#  download, published as the `world-data` release asset, started by a person
#  tapping GET CITY in the app and verified file by file as it arrives (D-048).
#  This workflow therefore also writes down which world the client it is building
#  was compiled against, and publishes the checksum list that download verifies
#  against.
# =============================================================================
name: android

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      physics:
        description: 'Build Jolt and the physics engine into the client'
        type: boolean
        default: true
      textures:
        description: 'Material arrays inside the APK: albedo (default), none, or all'
        type: choice
        options: [albedo, none, all]
        default: albedo

jobs:
  apk:
    name: build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Only for publishing the APK as a release asset: an artifact needs a GitHub
    # login to download, and a release asset is a plain link anyone can open.  The
    # repository is public, so that link works on a phone with no GitHub session.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate the Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "no SDK at $SDK; looking for one"
            SDK=$(dirname "$(dirname "$(find / -maxdepth 6 -type d -name 'platform-tools' 2>/dev/null | head -1)")")
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties
          echo "sdk.dir=$SDK"
          ls "$SDK" || true

      - name: Install platform, build tools, NDK and CMake
        run: |
          set -e
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_SDK_ROOT" -maxdepth 5 -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" 2>&1 | tail -5
          echo "--- installed"
          "$SDKMANAGER" --list_installed 2>/dev/null | tail -12

      - name: Install a GLSL compiler
        # apt first (seconds); the project's own fetcher as the fallback, which is
        # also the path a machine with no Vulkan SDK takes.
        run: |
          set -e
          if command -v glslc >/dev/null || command -v glslangValidator >/dev/null; then
            echo "already present"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq glslang-tools || bash tools/get_glslang.sh
          fi
          glslangValidator --version 2>/dev/null | head -2 || \
            echo "built by tools/get_glslang.sh into build/tools/glslang"

      - name: Compile the shaders, on their own
        run: |
          set -e
          export PATH="$PWD/build/tools/glslang:$PATH"
          python3 tools/compile_shaders.py engine/render/shaders build/spv

      - name: Fetch the map data
        # The raw sources are small (46 MB) and come from GitHub, so a clean
        # runner can rebuild the whole world from scratch — which is also the only
        # way the pipeline's own reproducibility claim is ever exercised.  The
        # script reads raw.githubusercontent.com first (no credentials) and falls
        # back to `gh api`, which is the only path that needs the token below.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/fetch_data.sh

      - name: Build the pipeline and the engine
        # The log is kept because a runner's log files are unreachable from some
        # machines (D-045) but step summaries and annotations are not: the step
        # below copies this file's errors into both.
        run: |
          set -o pipefail
          echo "::notice::compiler: $(c++ --version | head -1)"
          if pkg-config --exists vulkan 2>/dev/null; then
            echo "::notice::vulkan loader detected by pkg-config: the renderer will link it"
          else
            echo "::notice::no vulkan.pc: the renderer compiles CPU-only"
          fi
          make -j4 2>&1 | tee build.log
          # The JNI bridge is spelled in two languages, and neither compiler checks
          # the other one: a renamed Java method or a mistyped signature is a runtime
          # failure on a phone in the middle of a download.  This compares the two
          # files by name, in the same step that compiles them.
          python3 tools/verify_java_bridge.py

      - name: Build the world
        # 924 cells, 1.27 GiB: the same `make world` any machine runs.  Its own
        # report goes to the log and to the summary.
        run: |
          set -o pipefail
          make world 2>&1 | tee world-build.log
          python3 - <<'PYTHON'
          import json
          world = json.load(open('data/processed/world_manifest.json'))
          cells = world['cells']
          total = sum(c['bytes'] for c in cells)
          print(f"::notice::world built: {len(cells)} cells, {total} bytes "
                f"({total / 1048576.0:.1f} MiB), "
                f"{world['totals']['buildings']} buildings, "
                f"{world['totals']['triangles']} triangles")
          PYTHON

      - name: Pack the city into the downloadable archive
        # THIS IS ITS OWN STEP BECAUSE TWO LATER ONES NEED WHAT IT MAKES: the upload
        # needs the file, and the APK's release notes need its size — the number a
        # person deciding whether to press GET CITY actually cares about, which is
        # the packed size and not the 1.27 GiB the world occupies once it is
        # unpacked.  Packing here also means the slow part (45 s of gzip) happens
        # before Gradle runs, so a failure in the upload cannot cost a rebuild.
        run: |
          set -e
          mkdir -p release
          df -h / | sed 's/^/    /'
          python3 tools/pack_world.py --processed data/processed --out release --verify \
            2>&1 | tee /tmp/world-publish.log
          ls -l release | sed 's/^/    /'
          cp data/processed/world_manifest.json release/world_manifest.json
          df -h / | sed 's/^/    /'

      - name: Write down which world this build ships
        # The client names a download — repository, release asset, checksum list —
        # and the identity of that world is the sha256 of its manifest, which only
        # exists now that `make world` has run.  So the four strings go into a
        # generated header beside engine/world/world_release.h, which every other
        # build (a bare `make`, a test run, a checkout) reads as a set of empty
        # defaults meaning "this build knows of no published world" (D-048).
        run: |
          set -e
          SHA=$(sha256sum data/processed/world_manifest.json | cut -c1-16)
          ASSET="mumbai-world-$SHA.tar"
          SUMS="sha256sums-$SHA.txt"
          {
            echo "// Generated by .github/workflows/android.yml.  Do not edit or commit."
            echo "// The world this client was built against: $SHA"
            echo "#define MUMBAI_WORLD_REPOSITORY \"$GITHUB_REPOSITORY\""
            echo "#define MUMBAI_WORLD_TAG \"world-data\""
            echo "#define MUMBAI_WORLD_ASSET \"$ASSET\""
            echo "#define MUMBAI_WORLD_CHECKSUMS \"$SUMS\""
            echo "#define MUMBAI_WORLD_MANIFEST_SHA16 \"$SHA\""
          } > engine/world/world_release.generated.h
          cat engine/world/world_release.generated.h
          echo "::notice::this build's world: $ASSET"

      - name: Pack the starter world into the APK's assets
        # The client installs this out of its own package on first run, so a fresh
        # install shows South Bombay instead of a black screen (D-047).
        run: |
          set -o pipefail
          python3 tools/make_starter_world.py \
            --manifest data/processed/world_manifest.json \
            --out android/app/src/main/assets/world \
            --region south-bombay --textures ${{ github.event.inputs.textures || 'albedo' }} \
            2>&1 | tee starter-world.log
          grep -E '^STARTER_WORLD_(MB|CELLS)=' starter-world.log | sed 's/^/::notice::/'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the APKs
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            -PmumbaiPhysics=${{ github.event.inputs.physics == 'false' && 'OFF' || 'ON' }} \
            assembleDebug assembleRelease 2>&1 | tee gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Surface the build errors
        # The build's own log is the whole point of running it, and a runner's log
        # files are not always retrievable from outside.  Annotations and the step
        # summary are, through the API, so the first errors are copied there where
        # they can be read and fixed (D-045).
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import os, re, glob
          # Every log the workflow writes, newest steps first: a failure in the
          # native build used to be invisible from outside the runner, because only
          # Gradle's log was copied into the annotations.
          names = ['gradle-build.log', 'starter-world.log', 'world-build.log', 'build.log']
          logs = []
          for name in names:
              for path in glob.glob('/home/runner/work/**/' + name, recursive=True) + \
                          glob.glob(os.path.join(os.getcwd(), name)):
                  try:
                      logs.append((path, open(path, errors='replace').read()))
                  except OSError:
                      pass
          if not logs:
              print('no build log found to surface')
          pattern = re.compile(r'(error:|error C[0-9]|CMake Error|FAILURE:|What went wrong|'
                               r'Execution failed for task|Caused by:|ninja: error|'
                               r'undefined reference|No such file or directory|'
                               r'does not name a type|was not declared in this scope|'
                               r'Could not (resolve|find|determine))')
          for path, text in logs:
              lines = text.splitlines()
              hits = [l.strip() for l in lines if pattern.search(l)]
              print(f'--- {path}: {len(lines)} lines, {len(hits)} error-ish')
              for line in hits[:10]:
                  print(f'::error::{line[:900]}')
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a') as f:
                      f.write(f'### {path} — last 80 lines\n\n```\n')
                      f.write('\n'.join(lines[-80:]))
                      f.write('\n```\n')
              print('--- last 60 lines')
              print('\n'.join(lines[-60:]))
          PYTHON

      - name: Report what was built
        # The report goes three places on purpose: the log (for a human watching
        # the run), annotations and the job summary (because a runner's log files
        # and the log-download CDN are not reachable from every machine that needs
        # to answer "how big is the APK and what is in it") — D-045.
        if: always()
        run: |
          OUT=apk-report.txt
          {
            echo "=== APKs ==="
            find android/app/build/outputs -name '*.apk' -printf '%10s  %p\n' 2>/dev/null | sort -k2 \
              || echo "none built"
            for apk in $(find android/app/build/outputs -name '*.apk' 2>/dev/null); do
              echo "--- contents of $apk"
              unzip -l "$apk" | awk 'NR <= 3 || $4 ~ /lib\/|classes|resources|META-INF/ { printf "%10d  %s\n", $1, $4 }'
              echo "--- total"
              unzip -l "$apk" | tail -1
            done
            echo "=== native libraries ==="
            find android/app/build -name 'libmumbai.so' -printf '%10s  %p\n' 2>/dev/null || true
            echo "=== shaders embedded in the binary ==="
            for header in $(find android/app/.cxx -name 'shaders_generated.h' 2>/dev/null | head -2); do
              echo "--- $header"
              grep -c "inline constexpr std::uint32_t" "$header" || true
              grep -o "SpvWords = [0-9]*" "$header" | tr '\n' ' '
              echo
            done
          } > "$OUT" 2>&1 || true
          cat "$OUT"
          grep -E "apk|libmumbai|words" "$OUT" | head -24 | sed 's/^/::notice::/'
          {
            echo "## APK report"
            echo ""
            echo '```'
            cat "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the APK contains the engine and its shaders
        # "The build succeeded" and "the APK is the client" are different claims.
        # Two things could be missing without any error: the shader modules (a
        # build with no GLSL compiler embeds empty arrays, which is why
        # compile_shaders.py now fails without one) and the engine library itself.
        run: |
          set -e
          APK=$(find android/app/build/outputs -name 'app-debug.apk' | head -1)
          test -n "$APK" || { echo "::error::no debug APK was produced"; exit 1; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmumbai.so' || \
            { echo "::error::the APK has no libmumbai.so"; exit 1; }
          SIZE=$(unzip -l "$APK" | awk '$4 == "lib/arm64-v8a/libmumbai.so" { print $1 }')
          echo "libmumbai.so in the APK: $SIZE bytes"
          [ "$SIZE" -gt 500000 ] || { echo "::error::libmumbai.so is too small to be the engine"; exit 1; }

          HDR=$(find android/app/.cxx -name 'shaders_generated.h' | head -1)
          test -n "$HDR" || { echo "::error::the native build produced no shaders_generated.h"; exit 1; }
          python3 - "$HDR" <<'PYTHON'
          import re, sys
          text = open(sys.argv[1]).read()
          words = [int(w) for w in re.findall(r'SpvWords = (\d+)', text)]
          print(f'{len(words)} shader modules, {sum(words)} words total')
          if len(words) != 11:
              sys.exit(f'expected 11 shader modules, found {len(words)}')
          if any(w < 100 for w in words):
              sys.exit('a shader module is empty: the build embedded placeholders, not SPIR-V')
          print('::notice::shaders embedded in the client: %d modules, %d words of SPIR-V'
                % (len(words), sum(words)))
          PYTHON

          # The starter world has to be in there too: an APK with the engine and no
          # world is the black screen this whole change exists to remove.
          INDEX=$(unzip -l "$APK" | awk '$4 == "assets/world/INDEX.txt" { print $1 }')
          test -n "$INDEX" || { echo "::error::the APK has no assets/world/INDEX.txt"; exit 1; }
          CHUNKS=$(unzip -l "$APK" | awk '$4 ~ /^assets\/world\/cells\/.*\.mumbai_chunk$/ { n++ } END { print n + 0 }')
          echo "starter world in the APK: $CHUNKS chunk file(s)"
          [ "$CHUNKS" -ge 8 ] || { echo "::error::the APK carries only $CHUNKS chunks"; exit 1; }
          echo "::notice::starter world in the APK: $CHUNKS cells"
          echo "::notice::APK $(basename "$APK") $(stat -c%s "$APK") bytes, libmumbai.so $SIZE bytes"

      - name: Publish the APK as a release
        # A direct download link, which is the whole point: release assets are
        # fetchable without a session, Actions artifacts are not.
        #
        # THE NOTES ARE WRITTEN EVERY RUN, AND THAT IS A FIX.  They used to be
        # passed to `gh release create` only when the release did not exist yet, so
        # the first text this workflow ever wrote was the text everybody kept
        # reading — including numbers that had stopped being true.  Now the notes
        # go into a file and the file is applied whether the release is created or
        # edited, with the sizes and the world's hash interpolated from the build
        # that is being published.
        if: github.event_name == 'push' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="first-build"
          SHA=$(sha256sum data/processed/world_manifest.json | cut -c1-16)
          APK_BYTES=$(stat -c%s android/app/build/outputs/apk/debug/app-debug.apk)
          APK_MB=$(( APK_BYTES / 1048576 ))
          CELLS=$(python3 -c "import json;print(len(json.load(open('data/processed/world_manifest.json'))['cells']))")
          WORLD_BYTES=$(python3 -c "import json;w=json.load(open('data/processed/world_manifest.json'));print(sum(c['bytes'] for c in w['cells']))")
          WORLD_MB=$(( WORLD_BYTES / 1048576 ))
          STARTER_CELLS=$(python3 -c "import json;print(len(json.load(open('android/app/src/main/assets/world/world_manifest.json'))['cells']))")
          # The download is the packed archive, not the 1.27 GiB it unpacks to.
          PACKED=$(ls release/mumbai-world-*.tar 2>/dev/null | head -1)
          PACKED_MB=$(if [ -n "$PACKED" ]; then echo $(( $(stat -c%s "$PACKED") / 1048576 )); else echo "?"; fi)
          # The starter slice is a *slice*: if these two numbers ever agree, the step
          # that packs it read the wrong manifest, and the notes below would tell
          # someone their package holds the whole city when it does not.
          if [ "$STARTER_CELLS" = "$CELLS" ]; then
            echo "::warning::the starter world manifest has the same cell count as the city ($CELLS) - check the pack step, the release notes are quoting it"
          fi
          cat > /tmp/mumbai-release-notes.md <<NOTES
          ## Install

          **Download \`app-debug.apk\`** (${APK_MB} MB) and open it on an Android phone:
          Android 10 or newer, 64-bit ARM, Vulkan 1.1 — which is every device this
          renders on.  You may need to allow installing from unknown sources; it is
          signed with the standard debug key.

          ## What it does

          * Starts on the phone's own Vulkan surface and draws the world with the
            sky, sun and the tonemapped image.
          * Installs a slice of Mumbai out of the package on first run — **${STARTER_CELLS} cells
            of South Bombay**, a minute or so of copying, with its progress on the
            screen.  The screen is never black: if the graphics device refuses to
            start, the client paints the reason into the window on the CPU instead.
          * Streams the cells around the camera as you move, and shows what it is
            doing in a panel over the frame: frames per second, chunks resident,
            your position, and the state of the world.
          * **Left half of the screen steers, right half looks; the two buttons at
            the top right climb and descend.**  Everything goes to logcat
            (\`adb logcat -s mumbai\`) and, every few seconds, to \`Downloads/mumbai-log.txt\`
            — a file you can send without a cable.

          ## The whole city is a download, and it is yours to start

          South Bombay travels inside the APK.  The whole city — all ${CELLS} cells of
          the pipeline's own output: terrain, ${WORLD_MB} MB of buildings, roads and
          textures — is published as this repository's \`world-data\` release as a
          **${PACKED_MB} MB** download (it is ${WORLD_MB} MB once unpacked).  Press **GET CITY** in the app to pull them: the
          download shows its own progress, survives being killed, verifies every
          file it writes against the published checksums, and can be paused.
          There is a deliberate pause: nothing is downloaded until you ask, because
          it is somebody's data plan.

          This build was compiled against world \`${SHA}\`: the app refuses a published
          world whose manifest is not that one, before it fetches a byte.

          ## If the screen stays black

          The app writes \`mumbai-log.txt\` into your **Downloads** folder, and the
          log's first lines name your device, whether it reports **Vulkan 1.1**, and
          what the renderer said when it tried to start.  Send that file — it is the
          whole story, and without it "black screen" cannot be told apart from a
          device that simply has no Vulkan 1.1, which is a hardware floor rather than
          a bug.

          ## If you are holding an earlier copy of this app

          The very first APK drew only the sky — no world, no panel, no download —
          and that was the engine preview, not the product.  This build replaces it,
          and if that older one is installed, installing this over it is enough.

          ## What is not here yet

          Night lighting, wet-asphalt reflections, rain, the ocean's wave detail,
          anti-aliasing and the traffic simulation are roadmap items, named in
          \`DOCS/06_ROADMAP.md\` rather than implied.  This release is the pipeline,
          the streaming world and the renderer's first pass — not the finished
          picture.

          \`app-release-unsigned.apk\` is the same code without a signature; it needs
          your own signing key before a phone will accept it.

          Built by GitHub Actions.  The workflow refuses to publish unless the APK
          contains the engine library and all eleven compiled shader modules.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Mumbai 1:1 EXACT — the client (installable build)" \
              --notes-file /tmp/mumbai-release-notes.md
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Mumbai 1:1 EXACT — the client (installable build)" \
              --prerelease \
              --notes-file /tmp/mumbai-release-notes.md
          fi
          gh release upload "$TAG" android/app/build/outputs/apk/debug/app-debug.apk --clobber
          gh release upload "$TAG" android/app/build/outputs/apk/release/app-release-unsigned.apk --clobber
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) B  \(.url)"'
          echo "::notice::APK ${APK_BYTES} bytes for world ${SHA}; release notes rewritten"

      - name: Publish the whole city as a release asset
        # The APK carries South Bombay; the other 899 cells are a download, and a
        # download needs somewhere to live that does not need a GitHub session.
        # Re-published only when the world's manifest actually changes (the asset
        # carries the manifest's sha256 in its name), because 1.3 GB of upload is
        # not something to repeat for a shader edit.
        if: github.event_name == 'push' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="world-data"
          SHA=$(sha256sum data/processed/world_manifest.json | cut -c1-16)
          SIZE=$(du -sb data/processed | cut -f1)
          echo "::notice::world manifest sha256 (16): $SHA, data/processed $SIZE bytes"
          ASSET="mumbai-world-$SHA.tar"
          SUMS="sha256sums-$SHA.txt"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXISTING=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
                       --jq '.assets[].name' | grep -c "$SHA" || true)
            if [ "$EXISTING" != "0" ]; then
              echo "::notice::the world for manifest $SHA is already published; skipping the upload"
              exit 0
            fi
          fi
          # THE ARCHIVE WAS PACKED EARLIER IN THIS JOB and verified there; this step
          # only moves it, so its whole job is to be sure the thing the phone will
          # fetch is the thing that was built.  `ASSET` and `SUMS` carry the
          # manifest's sha256, which is why a re-run of an unchanged world finds the
          # asset already there and skips the upload entirely (D-048/D-051).
          test -s "release/$ASSET" || { echo "::error::no archive at release/$ASSET"; exit 1; }
          test -s "release/$SUMS" || { echo "::error::no checksum list was written"; exit 1; }
          grep -c "world_manifest.json" "release/$SUMS" | sed 's/^/    manifest entries in the list: /'
          ls -l "release/$ASSET" "release/$SUMS" | sed 's/^/    /'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Mumbai 1:1 EXACT — the world data" --prerelease \
              --notes "The published world: every cell of the pipeline's own output.

          This is every cell of the city, as a tar whose members are gzipped.

          WHY THAT SHAPE.  The app downloads this file over somebody's phone: it
          pauses when the phone is busy, it survives being killed, and it comes back
          to the byte after the last file it finished.  That resume point only
          exists in an *uncompressed* container, and the transfer is only affordable
          compressed - so the container is a plain tar and the members inside it are
          gzip.  client-side, the sink inflates each member and writes it under
          its own name, so what lands in the install directory is exactly the tree
          \`world_manifest.json\` describes: \`cells/\`, \`textures/\`, and the manifest
          itself, which stays uncompressed because its sha256 is the identity of the
          world.

          \`sha256sums-<manifest sha256:16>.txt\` lists every member of the archive -
          by its archive name, so \`cells/x.mumbai_chunk.gz\` - and the app's own
          downloader verifies each one while it extracts, refusing any member the
          list does not name and any byte that does not hash to what the list says.
          Each archive is named for the sha256 of the manifest it contains, so two
          assets with the same name describe the same world.

          Unpacking it by hand needs nothing special: \`tar xf <archive>\` gives the
          \`.gz\` members, \`gunzip\` gives the world.

          The APK carries a slice of this (South Bombay); this is all of it."
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "release/$ASSET" --clobber
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "release/$SUMS" --clobber
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" release/world_manifest.json --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) B  \(.url)"'
          # AND THEN ASK THE CDN, because a phone will.  An upload that returned
          # zero but left an asset nobody can fetch is the one failure this step
          # exists to prevent, and a HEAD request is what proves it did not happen.
          for asset in "$ASSET" "$SUMS"; do
            URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$asset"
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L -I "$URL")
            echo "::notice::HEAD $asset -> $CODE"
            if [ "$CODE" != "200" ]; then
              echo "::error::$asset is not downloadable (HTTP $CODE) from $URL"
              exit 1
            fi
          done

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload the unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-release-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload the SPIR-V modules
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-spirv
          path: build/spv/*.spv
          if-no-files-found: warn

      - name: Say what failed, where the API can read it
        # The build's own errors are surfaced right after Gradle (the step above),
        # but a step *after* that - the world publish, the release upload - had no
        # such place, and its failure arrived as "Process completed with exit code
        # 1" with the reason buried in a log that is not reachable from outside the
        # runner.  This is that place: disk, sizes, and the tail of the publish log,
        # as annotations.
        if: failure()
        run: |
          echo "::warning::a step failed; diagnostics follow"
          df -h / /tmp 2>&1 | sed 's/^/::warning::/'
          du -sh data/processed release 2>/dev/null | sed 's/^/::warning::/' || true
          for log in /tmp/world-publish.log world-publish.log gradle-build.log; do
            if [ -f "$log" ]; then
              echo "::warning::--- tail of $log"
              tail -n 30 "$log" | sed 's/^/::warning::/'
            fi
          done
          ls -l 2>/dev/null | sed 's/^/::warning::/' || true

      - name: Upload the native build's own files (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: |
            android/app/.cxx/**/build.ninja
            android/app/build/**/*.log
            android/local.properties
          if-no-files-found: ignore
