# Three gigabytes: the engine plus Jolt is a large translation unit set and the
# default heap is not enough for the native build's metadata.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true

# The app is pure native code (android:hasCode="false"): no AndroidX, no support
# libraries, nothing to jetify.
android.useAndroidX=false
android.enableJetifier=false

# The native build is the expensive part and the Kotlin/Java part is empty, so the
# build cache is worth more than usual here.
android.nonTransitiveRClass=true
